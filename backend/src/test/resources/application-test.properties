# Test profile — disable infrastructure that requires Redis/RabbitMQ connections
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Use H2 in-memory DB for tests (no real DB needed)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Valid typed configuration for tests
app.jwt.secret=test-secret-key-for-unit-tests-minimum-256-bits-long-enough
app.jwt.access-token-minutes=60
app.jwt.refresh-token-days=1
app.cors.allowed-origins=http://localhost:3000
app.http.connect-timeout=1s
app.http.read-timeout=2s
app.rate-limit.login-registration.capacity=50
app.rate-limit.login-registration.refill-period=1m
app.rate-limit.otp.capacity=1
app.rate-limit.otp.refill-period=1m
app.scheduler.zone=Asia/Ho_Chi_Minh
app.scheduler.pool-size=2
app.scheduler.enabled=false
app.scheduler.booking-cleanup-delay=1m
app.scheduler.weather-fetch-rate=30m
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
spring.mail.username=test
spring.mail.password=test
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
spring.flyway.enabled=false
spring.main.allow-bean-definition-overriding=true
app.checkin.qr-secret=danasea-secure-qr-checkin-hmac-sha256-default-key-32bytes-min!
app.checkin.opens-before=2h
app.checkin.closes-after=30m
app.payment.webhook-secret=test-payment-webhook-secret-minimum-256-bits-long
app.payment.paypal.mode=sandbox
app.payment.paypal.client-id=test-paypal-client-id
app.payment.paypal.client-secret=test-paypal-client-secret
ai.groq.api-keys=test-api-key-1,test-api-key-2,test-api-key-3,test-api-key-4,test-api-key-5
