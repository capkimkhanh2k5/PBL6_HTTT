policy.general=General DANASEA policy: customer protection, maritime safety, and transparent marine tourism services in Da Nang.
policy.refund=Refund policy: 100% more than 48 hours before departure, 70% from 24 to 48 hours, 30% from 2 to 24 hours, and no refund within 2 hours. Dangerous weather and vendor fault receive a full refund.
policy.cancellation=Cancellation policy: 100% refund more than 48 hours before departure, 70% from 24 to 48 hours, 30% from 2 to 24 hours, and no refund within 2 hours. Dangerous weather and vendor fault receive a full refund.
policy.weather_cancellation=Weather cancellation policy: when maritime conditions or natural hazards are unsafe, the trip receives a full refund or a free reschedule.
policy.safety=Safety policy: customers must wear life jackets and follow all maritime safety and guide instructions.
policy.refund.weather=Full refund due to dangerous maritime weather.
policy.refund.vendor_fault=Full refund due to a service-provider issue.
policy.refund.admin_override=Refund determined by an administrator.
policy.refund.100=100% deposit refund for cancellation more than 48 hours before departure.
policy.refund.70=70% deposit refund for cancellation 24 to 48 hours before departure.
policy.refund.30=30% deposit refund for cancellation 2 to 24 hours before departure.
policy.refund.0=No refund for cancellation within 2 hours or after departure.
policy.cancellation.mixed=Standard cancellation policy; different refund tiers apply to individual items.
