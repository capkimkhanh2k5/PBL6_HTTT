spring:
  application:
    name: backend
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp:
        auth: true
        starttls.enable: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      username: ${SPRING_REDIS_USERNAME:}
      password: ${SPRING_REDIS_PASSWORD:}
      connect-timeout: 5s
      timeout: 5s
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          max-interval: 10s
          multiplier: 2
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    execution:
      pool:
        core-size: ${APP_ASYNC_CORE_SIZE:4}
        max-size: ${APP_ASYNC_MAX_SIZE:16}
        queue-capacity: ${APP_ASYNC_QUEUE_CAPACITY:200}
      thread-name-prefix: danasea-async-
    scheduling:
      pool:
        size: ${APP_SCHEDULER_POOL_SIZE:4}
      thread-name-prefix: danasea-scheduler-

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.1[6-9]{1}\.\d{1,3}\.\d{1,3}|172\.2[0-9]{1}\.\d{1,3}\.\d{1,3}|172\.3[0-1]{1}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-token-minutes: ${APP_JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${APP_JWT_REFRESH_TOKEN_DAYS:7}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  checkin:
    qr-secret: ${APP_CHECKIN_QR_SECRET}
    opens-before: ${APP_CHECKIN_OPENS_BEFORE:2h}
    closes-after: ${APP_CHECKIN_CLOSES_AFTER:30m}
  payment:
    webhook-secret: ${APP_PAYMENT_WEBHOOK_SECRET:local-development-payment-webhook-secret-change-me}
  http:
    connect-timeout: ${APP_HTTP_CONNECT_TIMEOUT:5s}
    read-timeout: ${APP_HTTP_READ_TIMEOUT:10s}
  rate-limit:
    login-registration:
      capacity: ${APP_AUTH_RATE_LIMIT_CAPACITY:50}
      refill-period: ${APP_AUTH_RATE_LIMIT_REFILL_PERIOD:1m}
    otp:
      capacity: ${APP_OTP_RATE_LIMIT_CAPACITY:1}
      refill-period: ${APP_OTP_RATE_LIMIT_REFILL_PERIOD:1m}
  scheduler:
    zone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
    pool-size: ${APP_SCHEDULER_POOL_SIZE:4}
    booking-cleanup-delay: ${APP_BOOKING_CLEANUP_DELAY:1m}
    weather-fetch-rate: ${APP_WEATHER_FETCH_RATE:30m}
  weather:
    monitoring-cron: ${APP_WEATHER_MONITORING_CRON:0 */30 * * * *}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

open-meteo:
  base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com}
  marine-url: ${OPEN_METEO_MARINE_BASE_URL:https://marine-api.open-meteo.com}

ai:
  groq:
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    api-keys: ${GROQ_API_KEYS:}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    fallback-model: ${GROQ_FALLBACK_MODEL:openai/gpt-oss-20b}
    moderation-model: ${GROQ_MODERATION_MODEL:meta-llama/llama-prompt-guard-2-86m}
