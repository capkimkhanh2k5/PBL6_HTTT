# Optional Quyet worker. Model files are mounted from the already verified download.
services:
  quyet:
    build:
      context: ./backend/ai-decision
    restart: unless-stopped
    environment:
      AI_QUYET_API_KEY: ${AI_QUYET_API_KEY:?Set a private service key of at least 24 characters}
      QUYET_MODEL_DIR: /models
      QUYET_HOST: 0.0.0.0
      QUYET_CPU_THREADS: ${QUYET_CPU_THREADS:-4}
    volumes:
      - type: bind
        source: ${QUYET_MODEL_DIR:?Set the verified Quyet Small model directory}
        target: /models
        read_only: true
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2).read()"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
  backend:
    environment:
      AI_QUYET_ENABLED: "true"
      AI_QUYET_BASE_URL: http://quyet:8091
      AI_QUYET_API_KEY: ${AI_QUYET_API_KEY:?Set a private service key of at least 24 characters}
    depends_on:
      quyet:
        condition: service_healthy
